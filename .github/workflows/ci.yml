name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketdata
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etlpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl -d marketdata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: marketdata
      PGUSER: etl
      PGPASSWORD: etlpass
      REF_SOURCE: jdbc
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/fetch_jdbc.py
          echo "SPARK_JARS=$GITHUB_WORKSPACE/jars/postgresql-42.7.3.jar" >> $GITHUB_ENV

      - name: Generate data and seed Postgres
        run: |
          python src/generate_data.py
          python scripts/wait_for_postgres.py
          python scripts/seed_postgres.py

      - name: Test
        run: python -m pytest -q

      - name: Run pipeline
        run: |
          export SPARK_JARS=$GITHUB_WORKSPACE/jars/postgresql-42.7.3.jar
          python src/run_pipeline.py

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
